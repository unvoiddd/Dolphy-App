skill: "egm-brainstorm"
description: "Behavioral evaluation scenario suite for egm-brainstorm skill."

scenarios:
  - scenario_id: "open_ended_discovery_divergence"
    description: "Verifies open-ended conversational clarification without multiple-choice menus during initial discovery."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-brainstorm/SKILL.md"
    turns:
      - user_input: "I have a rough idea for a dynamic cache warming service that proactively fetches user profiles before peak morning traffic, but the requirements and operational limits are completely undefined. How should we explore this?"
        assertions:
          - type: "required_pattern"
            pattern: "(\\?|clarif|requirements|traffic|constraints|failure|goals)"
            message: "Brainstorming must initiate open inquiry directly in chat."
          - type: "forbidden_pattern"
            pattern: "(\\(Recommended\\)|Option 1|Option A|\\[1\\])"
            message: "Brainstorming must not present multiple-choice menus during initial discovery."

  - scenario_id: "readiness_gate_modal"
    description: "Asserts single-select modal presentation for readiness confirmation before launching Goldfishes."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-brainstorm/SKILL.md"
    turns:
      - user_input: "We have thoroughly explored the dynamic cache warming problem: it will run as an hourly cron pre-fetching the top 10k active user profiles from Postgres into Redis, constrained to a 5-minute execution window and under 100MB memory footprint. Please summarize the anchored hypothesis and present the readiness gate."
        assertions:
          - type: "required_pattern"
            pattern: "Review with Goldfishes"
            message: "Readiness gate must offer Review with Goldfishes."
          - type: "required_pattern"
            pattern: "Clarify additional constraints or assumptions in chat"
            message: "Readiness gate must offer option to clarify in chat."
          - type: "forbidden_pattern"
            pattern: "\\(Recommended\\)"
            message: "Readiness gate must not contain (Recommended) prefix."

  - scenario_id: "handoff_gate_modal_routing"
    description: "Asserts single-select modal routing to /egm-draft and RFC publishing upon completing brief."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-brainstorm/SKILL.md"
    turns:
      - user_input: "The Goldfish review and iteration loops are finished. I have reviewed and fully approved the finalized concepts_brief.md artifact. Please execute Step 4 (Finalize & Handoff)."
        assertions:
          - type: "required_pattern"
            pattern: "Publish concepts_brief\\.md as RFC for team feedback"
            message: "Handoff gate must offer RFC publication option."
          - type: "required_pattern"
            pattern: "Proceed to /egm-draft"
            message: "Handoff gate must offer proceeding to /egm-draft."
          - type: "forbidden_pattern"
            pattern: "/egm-discuss"
            message: "Handoff gate must not route to deprecated /egm-discuss."
          - type: "forbidden_pattern"
            pattern: "\\(Recommended\\)"
            message: "Handoff gate must not contain (Recommended) prefix."

  - scenario_id: "decision_matrix_generation"
    description: "Checks that tradeoffs and evaluation criteria are formatted clearly in a decision matrix."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-brainstorm/SKILL.md"
    turns:
      - user_input: "Create a decision matrix comparing Kafka vs RabbitMQ vs Pub/Sub for our pipeline."
        assertions:
          - type: "required_pattern"
            pattern: "\\|.*\\|.*\\|"
            message: "Decision matrix must be formatted as a Markdown table."
          - type: "contains"
            pattern: "Kafka"
            message: "Decision matrix must evaluate Kafka."
          - type: "contains"
            pattern: "RabbitMQ"
            message: "Decision matrix must evaluate RabbitMQ."
