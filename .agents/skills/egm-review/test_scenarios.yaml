skill: "egm-review"
description: "Behavioral evaluation scenario suite for egm-review skill."

scenarios:
  - scenario_id: "intake_preset_selection_before_split_discovery"
    description: "Asserts that Step 2 Curated Pipeline Preset selection precedes Step 3 Semantic Split Discovery."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Run EGM Review on docs/feature_spec_and_plan.md."
        assertions:
          - type: "required_pattern"
            pattern: "Select the review execution mode for this document"
            message: "Review must present curated presets modal first."
          - type: "required_pattern"
            pattern: "Interactive review with all review rubrics"
            message: "Preset modal must include Interactive review with all review rubrics."
          - type: "required_pattern"
            pattern: "Feature [sS]pec only"
            message: "Preset modal must include Feature spec only."
          - type: "forbidden_pattern"
            pattern: "\\(Recommended\\)"
            message: "Preset modal must not contain (Recommended) prefix."

  - scenario_id: "feature_spec_gates_only_bypass_flow"
    description: "Asserts that selecting Feature Spec Gates Only bypasses split discovery and halts before Stage 9."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Run EGM Review on early-stage feature spec with Preset: Feature Spec Gates Only."
        assertions:
          - type: "required_pattern"
            pattern: "(FeatureRange|1\\.\\.End|Stage 5|Initial Zoom Out)"
            message: "Review must set FeatureRange to 1..End and execute Feature Spec stages."
          - type: "forbidden_pattern"
            pattern: "(Stage 9|Implementation Readiness Test)"
            message: "Review must not execute Stage 9 when Feature Spec Gates Only is selected."

  - scenario_id: "comprehension_auditor_undefined_jargon"
    description: "Verifies comprehension critique flags undefined terminology."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Review this draft: 'The synchronizer will save data to InternalDB using MagicSync.'"
        assertions:
          - type: "required_pattern"
            pattern: "(MagicSync|InternalDB)"
            message: "Comprehension auditor must flag undefined terminology MagicSync or InternalDB."

  - scenario_id: "design_critic_missing_slo"
    description: "Injects distributed architecture lacking SLOs/latencies; asserts design critic catches omissions."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Review this design: 'We will store user profiles in a globally replicated database across multiple read replicas.'"
        assertions:
          - type: "required_pattern"
            pattern: "(SLO|latency|consistency|replication lag)"
            message: "Design critic must flag missing SLOs, latency targets, or replication lag risks."

  - scenario_id: "readiness_reviewer_vague_tasks"
    description: "Injects underspecified tasks; asserts readiness review flags non-actionable steps."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Review implementation plan: '1. Write the client library. 2. Run verification.'"
        assertions:
          - type: "required_pattern"
            pattern: "(vague|actionable|underspecified|test|specific)"
            message: "Readiness review must flag non-actionable or vague implementation steps."

  - scenario_id: "structural_and_style_audit"
    description: "Verifies heading hierarchy, banned adjectives, and objective tone."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Audit the style and structure of this design document draft."
        assertions:
          - type: "forbidden_pattern"
            pattern: "(brilliant|amazing|fantastic|great job)"
            message: "Style audit must adhere to anti-sycophancy constraints and avoid flattery."

  - scenario_id: "comprehension_without_reimplementation_standard"
    description: "Verifies the Comprehension Test does not apply the re-implementation standard to a design document."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Run only Stage 6 (Comprehension Test) on docs/designs/rate_limit.md. Which document standard does the reviewer apply?"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)(no (document )?standard|self-containment)"
            message: "Comprehension tests self-containment with no document standard, not the re-implementation standard."

  - scenario_id: "comprehension_report_keeps_paraphrase"
    description: "Verifies the Comprehension Test report keeps the reviewer's paraphrase."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review/SKILL.md"
    turns:
      - user_input: "Run only Stage 6 (Comprehension Test) on docs/designs/rate_limit.md. The reviewer reports no findings. What goes in comprehension_report.md?"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)paraphrase"
            message: "The comprehension report must keep the paraphrase, also when there are no findings."
