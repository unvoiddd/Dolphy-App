name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default "tools" package no longer exists on current
          # runner images; install only the packages the build actually needs.
          packages: ""

      - name: Install platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :core:model:test \
            :core:hal:test \
            :core:security:test \
            :rootd:test \
            :bridge:flipper:test \
            --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: |
            app/build/reports/tests/
            core/*/build/reports/tests/
            rootd/build/reports/tests/
            bridge/*/build/reports/tests/
            app/build/outputs/apk/debug/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create temporary lint keystore
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/lint.jks" \
            -storepass lintpass -keypass lintpass \
            -alias lint -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Dolphy CI Lint, OU=CI, O=Dolphy, L=NA, ST=NA, C=NA"
          {
            echo "DOLPHY_KEYSTORE_FILE=$RUNNER_TEMP/lint.jks"
            echo "DOLPHY_KEYSTORE_PASSWORD=lintpass"
            echo "DOLPHY_KEY_ALIAS=lint"
            echo "DOLPHY_KEY_PASSWORD=lintpass"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew :app:lintVitalRelease --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: app/build/intermediates/lint_vital_intermediate_text_report/release/lintVitalReportRelease/lint-results-release.txt
          if-no-files-found: ignore
          retention-days: 14
